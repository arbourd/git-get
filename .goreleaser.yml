version: 2

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"

archives:
  - name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - completions/*
      - man/*
    format_overrides:
      - goos: windows
        formats:
          - zip
